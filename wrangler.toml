name = "ncc-bot"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "ncc-bot-db"
database_id = "REPLACE_AFTER_RUNNING_WRANGLER_D1_CREATE"
migrations_dir = "migrations"

[vars]
# Must be set to the real deployed Worker URL before production use — magic-link
# emails are built from this value, so leaving it unset points sign-in links at
# localhost and nobody can sign in.
SITE_URL = "REPLACE_WITH_YOUR_DEPLOYED_WORKER_URL"
EMAIL_FROM = "NCC Bot <login@REPLACE_WITH_YOUR_VERIFIED_RESEND_DOMAIN>"
