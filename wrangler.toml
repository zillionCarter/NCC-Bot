name = "ncc-bot"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "ncc-bot-db"
database_id = "a0189fa9-a42a-4823-bb99-1dcbe27a425d"
migrations_dir = "migrations"

[vars]
# Must be set to the real deployed Worker URL before production use — magic-link
# emails are built from this value, so leaving it unset points sign-in links at
# localhost and nobody can sign in.
SITE_URL = "https://ncc-bot.aroper.workers.dev"
EMAIL_FROM = "NCC Bot <login@alexroper.dev>"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/auth/*"]
